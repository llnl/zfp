name: Coverage Report

# for production: use coverage workflow from default branch (develop)
#on:
# workflow_run:
#   workflows: [Tests]
#   types: [completed]

# for testing/debugging: use coverage workflow from feature branch
on: push

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      CC: gcc-13
      CXX: g++-13
    # comment out when running workflow on feature branch
#   if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
          architecture: x64

      - name: Install Dependencies
        run: |-
          sudo apt install lcov
          python -m pip install lcov_cobertura

      - name: Run CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="--coverage -O0" -DCMAKE_CXX_FLAGS="--coverage -O0" -DBUILD_TESTING_FULL=ON -DBUILD_CFP=ON -DZFP_WITH_OPENMP=ON

      - name: Build
        run: cmake --build ${{github.workspace}}/build

      - name: Run Tests
        working-directory: ${{github.workspace}}/build
        run: ctest -j 8

      - name: Generate Coverage Report
        working-directory: ${{github.workspace}}/build
        run: |-
          lcov --gcov-tool gcov-13 --capture --directory ${{github.workspace}}/build --output-file coverage.info --ignore-errors inconsistent,mismatch
          lcov --gcov-tool gcov-13 --remove coverage.info '${{github.workspace}}/build/tests/*' --remove coverage.info '${{github.workspace}}/tests/*' --remove coverage.info '/usr/include/*' --output-file coverage.info --ignore-errors inconsistent,mismatch
          lcov_cobertura ${{github.workspace}}/build/coverage.info -d -o ${{github.workspace}}/build/coverage.xml

      - name: Upload Report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          gcov_executable: gcov-13
          files: ${{github.workspace}}/build/coverage.xml
          token: ${{secrets.CODECOV_TOKEN}}
          fail_ci_if_error: true
          verbose: true
